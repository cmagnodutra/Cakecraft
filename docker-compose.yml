services:
  postgres:
    image: postgres:16-alpine
    container_name: cakecraft-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cakecraft
      POSTGRES_PASSWORD: cakecraft
      POSTGRES_DB: cakecraft
    ports:
      - "5432:5432"
    volumes:
      - cakecraft_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cakecraft"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cakecraft-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - cakecraft_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cakecraft_postgres_data:
  cakecraft_redis_data:
